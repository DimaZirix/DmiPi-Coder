<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <style>
    .frame { fill: #ffffff; stroke: #999999; stroke-width: 1.5; }
    .bar { fill: #e6e6e6; stroke: #999999; }
    .panel { fill: #f7f7f7; stroke: #bbbbbb; }
    .mono { font-family: monospace; font-size: 14px; fill: #222222; }
    .muted { fill: #808080; }
    .bold { font-weight: bold; }
    .label { font-family: sans-serif; font-size: 12px; fill: #555555; }
    .callout { stroke: #999999; stroke-dasharray: 4 3; fill: none; }
    .titlebar { font-family: sans-serif; font-size: 13px; fill: #444444; }
  </style>
  <rect x="20" y="20" width="700" height="600" class="frame"/>
  <rect x="20" y="20" width="700" height="28" class="bar"/>
  <text x="32" y="39" class="titlebar">Terminal — coder (project: ~/work/app)</text>

  <text x="32" y="72" class="mono muted">Ready. Type a prompt, a /command (/plan, /resume, /llm, /exit), or /exit.</text>
  <text x="32" y="92" class="mono muted">Saved sessions: session-2026-09-10-14-02-11 — continue one with /resume &lt;name&gt;.</text>

  <text x="32" y="126" class="mono bold">&gt; add a --dry-run flag to the deploy script</text>

  <text x="32" y="156" class="mono">· read_file scripts/deploy.sh</text>
  <text x="32" y="176" class="mono muted">  read 120 lines</text>
  <text x="32" y="200" class="mono">· edit scripts/deploy.sh</text>
  <text x="32" y="220" class="mono muted">  --- scripts/deploy.sh</text>
  <text x="32" y="240" class="mono muted">  +++ scripts/deploy.sh</text>
  <text x="32" y="260" class="mono">  -  run_deploy</text>
  <text x="32" y="280" class="mono">  +  [ "$DRY_RUN" ] || run_deploy</text>
  <text x="32" y="308" class="mono">· todo_write</text>
  <text x="32" y="328" class="mono">  [x] read the deploy script</text>
  <text x="32" y="348" class="mono">  [~] add the flag</text>
  <text x="32" y="368" class="mono">  [ ] run the tests</text>
  <text x="32" y="396" class="mono">  │ · grep_search DRY_RUN</text>
  <text x="32" y="416" class="mono muted">  │   grep_search 'DRY_RUN' in .: 2 matches</text>
  <text x="32" y="444" class="mono">I added a --dry-run flag that skips run_deploy. The tests still pass.</text>
  <text x="32" y="464" class="mono">Next: wire the flag into the CI job.</text>

  <text x="32" y="500" class="mono muted">(compacted context ~91000 → ~24000 tokens)</text>

  <text x="32" y="540" class="mono bold">&gt; _</text>

  <rect x="740" y="60" width="240" height="46" class="panel"/>
  <text x="750" y="78" class="label">Start banner: commands available and</text>
  <text x="750" y="94" class="label">saved sessions offered for /resume.</text>

  <rect x="740" y="112" width="240" height="30" class="panel"/>
  <text x="750" y="131" class="label">Prompt line: one prompt starts one turn.</text>

  <rect x="740" y="150" width="240" height="60" class="panel"/>
  <text x="750" y="168" class="label">Activity line per action ("· tool target"),</text>
  <text x="750" y="184" class="label">then its result: a short line, a diff with</text>
  <text x="750" y="200" class="label">+/- colouring, or the task list.</text>

  <rect x="740" y="300" width="240" height="46" class="panel"/>
  <text x="750" y="318" class="label">Task list marks: [ ] pending,</text>
  <text x="750" y="334" class="label">[~] in progress, [x] completed.</text>

  <rect x="740" y="386" width="240" height="46" class="panel"/>
  <text x="750" y="404" class="label">Subagent work is prefixed with "│" so</text>
  <text x="750" y="420" class="label">it reads apart from the main stream.</text>

  <rect x="740" y="436" width="240" height="46" class="panel"/>
  <text x="750" y="454" class="label">The agent's answer streams as text,</text>
  <text x="750" y="470" class="label">between the actions that produced it.</text>

  <rect x="740" y="490" width="240" height="30" class="panel"/>
  <text x="750" y="509" class="label">Housekeeping note when history is compacted.</text>

  <rect x="740" y="528" width="240" height="46" class="panel"/>
  <text x="750" y="546" class="label">Next prompt. Ctrl+C cancels a running turn;</text>
  <text x="750" y="562" class="label">idle, it exits the console.</text>

  <line x1="720" y1="83" x2="740" y2="83" class="callout"/>
  <line x1="720" y1="127" x2="740" y2="127" class="callout"/>
  <line x1="720" y1="180" x2="740" y2="180" class="callout"/>
  <line x1="720" y1="323" x2="740" y2="323" class="callout"/>
  <line x1="720" y1="409" x2="740" y2="409" class="callout"/>
  <line x1="720" y1="459" x2="740" y2="459" class="callout"/>
  <line x1="720" y1="505" x2="740" y2="505" class="callout"/>
  <line x1="720" y1="551" x2="740" y2="551" class="callout"/>
</svg>
