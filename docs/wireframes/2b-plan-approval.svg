<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <style>
    .frame { fill: #ffffff; stroke: #999999; stroke-width: 1.5; }
    .bar { fill: #e6e6e6; stroke: #999999; }
    .panel { fill: #f7f7f7; stroke: #bbbbbb; }
    .mono { font-family: monospace; font-size: 14px; fill: #222222; }
    .muted { fill: #808080; }
    .bold { font-weight: bold; }
    .label { font-family: sans-serif; font-size: 12px; fill: #555555; }
    .callout { stroke: #999999; stroke-dasharray: 4 3; fill: none; }
    .titlebar { font-family: sans-serif; font-size: 13px; fill: #444444; }
  </style>
  <rect x="20" y="20" width="700" height="600" class="frame"/>
  <rect x="20" y="20" width="700" height="28" class="bar"/>
  <text x="32" y="39" class="titlebar">Terminal — coder (project: ~/work/app)</text>

  <text x="32" y="80" class="mono bold">&gt; /plan</text>
  <text x="32" y="100" class="mono muted">(plan mode on — mutations are blocked until you approve a plan)</text>
  <text x="32" y="130" class="mono bold">&gt; migrate the config loader to records</text>
  <text x="32" y="160" class="mono">· read_file src/config/Loader.java</text>
  <text x="32" y="180" class="mono muted">  read 88 lines</text>
  <text x="32" y="200" class="mono">· grep_search new Loader\(</text>
  <text x="32" y="220" class="mono muted">  grep_search 'new Loader\(' in .: 4 matches</text>
  <text x="32" y="244" class="mono">✗ edit: Plan mode is active: mutating calls are blocked until the plan is approved.</text>
  <text x="32" y="272" class="mono">· present_plan</text>

  <text x="32" y="306" class="mono bold">The agent presents a plan. Approve it to leave plan mode?</text>
  <text x="32" y="330" class="mono muted">    1. Replace the Loader class with a Config record (src/config/Loader.java).</text>
  <text x="32" y="350" class="mono muted">    2. Update the 4 call sites found by grep_search.</text>
  <text x="32" y="370" class="mono muted">    3. Reuse ConfigParser as is; no new dependency.</text>
  <text x="32" y="390" class="mono muted">    4. Verify: mvn -q test.</text>
  <text x="32" y="420" class="mono">  1) Approve — start the work</text>
  <text x="32" y="440" class="mono">  2) Keep planning</text>
  <text x="32" y="470" class="mono bold">Select (number): 1</text>
  <text x="32" y="500" class="mono muted">  plan approved</text>
  <text x="32" y="524" class="mono">· edit src/config/Loader.java</text>

  <rect x="740" y="70" width="240" height="46" class="panel"/>
  <text x="750" y="88" class="label">/plan switches to plan mode; /plan off</text>
  <text x="750" y="104" class="label">switches back without a plan.</text>

  <rect x="740" y="230" width="240" height="46" class="panel"/>
  <text x="750" y="248" class="label">In plan mode every mutating call is refused;</text>
  <text x="750" y="264" class="label">the agent is told why and keeps reading.</text>

  <rect x="740" y="296" width="240" height="60" class="panel"/>
  <text x="750" y="314" class="label">The plan text is the preview. Approving</text>
  <text x="750" y="330" class="label">switches the mode back to default and the</text>
  <text x="750" y="346" class="label">work starts; "Keep planning" stays in plan.</text>

  <rect x="740" y="490" width="240" height="46" class="panel"/>
  <text x="750" y="508" class="label">After approval, edits and commands are</text>
  <text x="750" y="524" class="label">asked about as in default mode.</text>

  <line x1="720" y1="93" x2="740" y2="93" class="callout"/>
  <line x1="720" y1="244" x2="740" y2="244" class="callout"/>
  <line x1="720" y1="326" x2="740" y2="326" class="callout"/>
  <line x1="720" y1="513" x2="740" y2="513" class="callout"/>
</svg>
