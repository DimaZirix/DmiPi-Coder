name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Tests that need bwrap, podman, systemd or curl skip themselves when the host lacks them.
      - name: Build and test
        run: mvn -B verify

      - name: Keep the console jar as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-console
          path: agent-console/target/agent-console-*-all.jar
