name: Release

# Push a tag like v1.2.0: the version becomes 1.2.0, agent-core is published to GitHub Packages,
# and a GitHub release is created with the runnable console jar attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          server-id: github

      - name: Set the version from the tag
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Build, test, and publish agent-core to GitHub Packages
        run: mvn -B deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the GitHub release with the console jar
        run: gh release create "$GITHUB_REF_NAME" agent-console/target/agent-console-*-all.jar --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
