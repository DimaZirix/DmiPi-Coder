name: Release

# Push a tag like v1.2.0: the version becomes 1.2.0, everything is built and tested, and a GitHub
# release is created with the runnable console jar and the agent-core library jar attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set the version from the tag
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B verify

      - name: Create the GitHub release with the jars
        run: >
          gh release create "$GITHUB_REF_NAME"
          agent-console/target/agent-console-*-all.jar
          agent-core/target/agent-core-*.jar
          --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
